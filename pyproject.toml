# ══════════════════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ══════════════════════════════════════════════════════════════════════════════
[project]
name = "zipr"
version = "0.1.0"
description = "zip, but it actually uses all your cores."
readme = "README.md"
authors = [
    { name = "fstormacq", email = "florian_stormacq@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "isal>=1.8.0",
]

# ══════════════════════════════════════════════════════════════════════════════
# PROJECT SCRIPTS
# ══════════════════════════════════════════════════════════════════════════════
[project.scripts]
zipr = "src.main:main"

# ══════════════════════════════════════════════════════════════════════════════
# UV
# ══════════════════════════════════════════════════════════════════════════════
[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.4",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.5.1",
]


# ══════════════════════════════════════════════════════════════════════════════
# BUILD SYSTEM
# ══════════════════════════════════════════════════════════════════════════════
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ══════════════════════════════════════════════════════════════════════════════
# HATCH
# ══════════════════════════════════════════════════════════════════════════════
[tool.hatch.build.targets.wheel]
packages = ["src"]

# ══════════════════════════════════════════════════════════════════════════════
# RUFF - Linter & Formatter
# ══════════════════════════════════════════════════════════════════════════════
[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [".git", ".venv", "__pycache__", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "ISC001",
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ══════════════════════════════════════════════════════════════════════════════
# PYTEST
# ══════════════════════════════════════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast, isolated unit tests with no I/O",
    "integration: tests that interact with the filesystem or hardware",
    "slow: tests that are long to execute",
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]


# ══════════════════════════════════════════════════════════════════════════════
# COVERAGE
# ══════════════════════════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# fail-under=80
exclude_also = [
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]
